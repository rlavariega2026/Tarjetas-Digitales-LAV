name: Construir y publicar Tarjetas Digitales

on:
  push:
    branches:
      - main
      - fix/tarjetas-digitales
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tarjetas-digitales-hostinger-deploy-v2
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar PHP para validar el publicador
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: none

      - name: Validar sintaxis del publicador PHP
        run: php -l public/api/publish-card.php

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: Validar tipos TypeScript
        run: npm run lint

      - name: Construir aplicacion
        run: npm run build
        env:
          VITE_BASE_PATH: "/tarjetas-digitales/"

      - name: Incluir reglas Apache para Hostinger
        run: cp public/.htaccess dist/.htaccess

      - name: Preparar archivos para descargar
        uses: actions/upload-artifact@v4
        with:
          name: tarjetas-digitales-dist
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Instalar cliente FTP
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Publicar en Hostinger por FTP
        env:
          FTP_SERVER: ${{ secrets.HOSTINGER_FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
        run: |
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER" -e "
            set ftp:passive-mode true;
            set net:timeout 30;
            set net:max-retries 2;
            set net:reconnect-interval-base 5;
            mirror --reverse --verbose --no-perms --only-newer ./dist/ /public_html/tarjetas-digitales/;
            bye
          "
