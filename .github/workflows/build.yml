name: Construir y publicar Tarjetas Digitales

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tarjetas-digitales-hostinger-deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HOSTINGER_FTP_SERVER: ${{ secrets.HOSTINGER_FTP_SERVER }}
      HOSTINGER_FTP_USERNAME: ${{ secrets.HOSTINGER_FTP_USERNAME }}
      HOSTINGER_FTP_PASSWORD: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
      HOSTINGER_FTP_SERVER_DIR: ${{ secrets.HOSTINGER_FTP_SERVER_DIR }}

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: Construir aplicacion
        run: npm run build
        env:
          VITE_BASE_PATH: "/tarjetas-digitales/"

      - name: Preparar archivos para descargar
        uses: actions/upload-artifact@v4
        with:
          name: tarjetas-digitales-dist
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Publicar en Hostinger por FTP
        if: ${{ env.HOSTINGER_FTP_SERVER != '' && env.HOSTINGER_FTP_USERNAME != '' && env.HOSTINGER_FTP_PASSWORD != '' && env.HOSTINGER_FTP_SERVER_DIR != '' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.HOSTINGER_FTP_SERVER }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          server-dir: ${{ secrets.HOSTINGER_FTP_SERVER_DIR }}
          local-dir: ./dist/
          dangerous-clean-slate: false
          log-level: standard

      - name: Avisar que falta configurar el acceso de Hostinger
        if: ${{ env.HOSTINGER_FTP_SERVER == '' || env.HOSTINGER_FTP_USERNAME == '' || env.HOSTINGER_FTP_PASSWORD == '' || env.HOSTINGER_FTP_SERVER_DIR == '' }}
        run: |
          echo "::warning::La compilacion termino, pero falta configurar los secretos FTP de Hostinger en GitHub. No se publico el sitio.";
