name: Construir Tarjetas Digitales

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: Construir aplicacion
        run: npm run build
        env:
          VITE_BASE_PATH: "/tarjetas-digitales/"

      - name: Preparar archivos para descargar
        uses: actions/upload-artifact@v4
        with:
          name: tarjetas-digitales-dist
          path: dist/
          if-no-files-found: error
          retention-days: 14
