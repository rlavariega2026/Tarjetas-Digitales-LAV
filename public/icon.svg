<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Base Background -->
  <rect width="512" height="512" rx="104" fill="url(#bgGrad)" />
  
  <!-- Outer glowing accent ring -->
  <rect x="24" y="24" width="464" height="464" rx="88" fill="none" stroke="url(#cardGrad)" stroke-width="4" stroke-opacity="0.35" />

  <!-- Digital Card Angled -->
  <g transform="translate(256, 256) rotate(-8) translate(-256, -256)">
    <!-- Card Shadow -->
    <rect x="96" y="146" width="320" height="200" rx="24" fill="#000" opacity="0.4" filter="url(#glow)" />
    <!-- Card Body -->
    <rect x="96" y="146" width="320" height="200" rx="24" fill="url(#cardGrad)" />
    
    <!-- Chip / Contactless NFC waves -->
    <rect x="136" y="186" width="46" height="36" rx="8" fill="url(#goldGrad)" opacity="0.9" />
    <path d="M148 186 v36 M170 186 v36 M136 204 h46" stroke="#b45309" stroke-width="2" fill="none" />
    
    <!-- Signal waves -->
    <path d="M210 192 A 20 20 0 0 1 210 216" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.75" />
    <path d="M222 184 A 32 32 0 0 1 222 224" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.5" />
    <path d="M234 176 A 44 44 0 0 1 234 232" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.3" />

    <!-- Brand Typography LAV inside Card -->
    <text x="376" y="212" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="900" fill="#ffffff" text-anchor="end" letter-spacing="2">LAV</text>
    <text x="376" y="230" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#ffffff" text-anchor="end" opacity="0.8" letter-spacing="3">DIGITAL MKT</text>

    <!-- Card line elements -->
    <rect x="136" y="270" width="160" height="8" rx="4" fill="#ffffff" opacity="0.85" />
    <rect x="136" y="288" width="100" height="6" rx="3" fill="#ffffff" opacity="0.5" />
    <circle cx="366" cy="284" r="14" fill="#ffffff" opacity="0.9" />
  </g>

  <!-- Front badge indicator -->
  <circle cx="396" cy="116" r="12" fill="#10b981" />
  <circle cx="396" cy="116" r="20" fill="none" stroke="#10b981" stroke-width="2" opacity="0.5" />
</svg>
